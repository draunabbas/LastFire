$('al').textContent=Z?'ALIVE '+(bots.filter(b=>!b.dead).length+1):'SCORE '+P.score;$('wn').textContent=W[P.cur].n+(P.reloading?' · RELOADING':'');$('am').textContent=s.m;$('rs').textContent='/ '+(s.res==Infinity?'∞':s.res);
$('zn').textContent=!Z?'PRACTICE RANGE':Math.hypot(P.pos.x-Z.x,P.pos.z-Z.z)>Z.r?'⚠ GO INSIDE THE ZONE!':Z.st==0?'Zone shrinks in '+Math.max(0,Math.ceil(Z.hold-Z.t))+'s':Z.st==1?'Zone is shrinking!':'Final zone'}
const mc=$('mm').getContext('2d');function mini(){mc.clearRect(0,0,104,104);const k=104/380,X=x=>52+x*k,Y=z=>52+z*k;if(Z){mc.strokeStyle='#4db0ff';mc.lineWidth=2;mc.beginPath();mc.arc(X(Z.x),Y(Z.z),Z.r*k,0,7);mc.stroke()}
mc.fillStyle='#e5483b';bots.forEach(b=>{if(!b.dead&&Math.hypot(b.pos.x-P.pos.x,b.pos.z-P.pos.z)<70){mc.fillRect(X(b.pos.x)-2,Y(b.pos.z)-2,4,4)}});
mc.save();mc.translate(X(P.pos.x),Y(P.pos.z));mc.rotate(-yaw);mc.fillStyle='#fff';mc.beginPath();mc.moveTo(0,-6);mc.lineTo(4,4);mc.lineTo(-4,4);mc.fill();mc.restore()}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-loop.l)/1000||.016);loop.l=now;if(mode=='play')step(dt);else{orb+=dt*.06;cam.position.set(Math.cos(orb)*130,55,Math.sin(orb)*130);cam.lookAt(0,8,0);sky.position.copy(cam.position);sun.position.set(60,90,40);sun.target.position.set(0,0,0)}
ren.render(scene,cam)}requestAnimationFrame(loop);
/* ---------- input ---------- */
addEventListener('keydown',e=>{K[e.code]=1;ac();if(e.code=='Space'||e.code.startsWith('Arrow'))e.preventDefault();if(mode!='play')return;if(e.code=='KeyR')reload();if(/^Digit[1-5]$/.test(e.code))sel(ORD[+e.code[5]-1])});addEventListener('keyup',e=>K[e.code]=0);
addEventListener('blur',()=>{for(const k in K)K[k]=0});
let drag=false;cv.addEventListener('mousedown',()=>{drag=true;if(mode=='play'&&!isT&&document.pointerLockElement!=cv){try{cv.requestPointerLock()}catch(e){}}});addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{if(mode!='play'||!(document.pointerLockElement==cv||drag))return;yaw-=e.movementX*.0025*SV[S.sens];pitch=Math.max(-.7,Math.min(1,pitch-e.movementY*.0025*SV[S.sens]))});
const lk={};let joyId=null,jc=null;
function hold(el,on,off){el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();ac();on()},{passive:false});['touchend','touchcancel'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();off&&off()},{passive:false}))}
hold($('fb'),()=>tFire=1,()=>tFire=0);hold($('jb'),()=>tJump=1,()=>tJump=0);hold($('rb'),()=>reload());hold($('sb'),()=>swap());
$('joy').addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();const t=e.changedTouches[0];joyId=t.identifier;const r=$('joy').getBoundingClientRect();jc=[r.left+r.width/2,r.top+r.height/2];jm(t)},{passive:false});
function jm(t){let dx=t.clientX-jc[0],dy=t.clientY-jc[1];const l=Math.hypot(dx,dy),m=55;if(l>m){dx*=m/l;dy*=m/l}joy.x=dx/m;joy.z=-dy/m;$('joy').firstChild.style.transform=`translate(${dx}px,${dy}px)`}
cv.addEventListener('touchstart',e=>{e.preventDefault();ac();for(const t of e.changedTouches)lk[t.identifier]=[t.clientX,t.clientY]},{passive:false});
addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier==joyId)jm(t);else if(lk[t.identifier]&&mode=='play'){const o=lk[t.identifier];yaw-=(t.clientX-o[0])*.006*SV[S.sens];pitch=Math.max(-.7,Math.min(1,pitch-(t.clientY-o[1])*.005*SV[S.sens]));o[0]=t.clientX;o[1]=t.clientY}}},{passive:false});
['touchend','touchcancel'].forEach(n=>addEventListener(n,e=>{for(const t of e.changedTouches){delete lk[t.identifier];if(t.identifier==joyId){joyId=null;joy.x=joy.z=0;$('joy').firstChild.style.transform=''}}}));
/* ---------- menus ---------- */
const show=i=>{['menu','wsel','set','over'].forEach(x=>$(x).classList.add('hide'));$(i).classList.remove('hide')};
$('bStart').onclick=()=>start('battle');$('bPrac').onclick=()=>start('practice');$('bWep').onclick=()=>{show('wsel');cards()};$('bSet').onclick=()=>{show('set');setT()};
$('wOk').onclick=$('sOk').onclick=()=>show('menu');$('bAgain').onclick=()=>start(mode0);$('bMenu').onclick=()=>{mode='menu';clearAll();P=null;zv.visible=false;show('menu')};
$('ex').onclick=()=>{if(mode0=='practice')finish(false);else{mode='menu';if(document.exitPointerLock)document.exitPointerLock();clearAll();P=null;zv.visible=false;$('hud').classList.add('hide');show('menu')}};
function cards(){$('cards').innerHTML=ORD.map(t=>{const w=W[t];return`<div class="card ${S.start==t?'on':''}" data-t="${t}"><b>${w.n}</b>Damage ${w.d*w.p}<br>Speed ${(1/w.r).toFixed(1)}/s<br>Mag ${w.m}</div>`}).join('');
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{S.start=c.dataset.t;cards()})}
function setT(){$('sSnd').textContent='SOUND: '+(S.snd?'ON':'OFF');$('sSens').textContent='LOOK SPEED: '+SN[S.sens];$('sDiff').textContent='DIFFICULTY: '+DF[S.diff];$('sSh').textContent='SHADOWS: '+(S.sh?'ON':'OFF')}
$('sSnd').onclick=()=>{S.snd^=1;setT()};$('sSens').onclick=()=>{S.sens=(S.sens+1)%3;setT()};$('sDiff').onclick=()=>{S.diff=(S.diff+1)%3;setT()};$('sSh').onclick=()=>{S.sh^=1;ren.shadowMap.enabled=!!S.sh;sun.castShadow=!!S.sh;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});setT()};
</script></body></html>
